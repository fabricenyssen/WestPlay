name: Build WestPlay Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          # Applique le patch de l'égaliseur s'il est présent à la racine
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          } elseif (Test-Path "westplay-2.1.4-son3d-egaliseur-reprise.patch") {
            git apply --verbose westplay-2.1.4-son3d-egaliseur-reprise.patch
          }
        shell: powershell

      - name: Compile Game Plugin (DLL)
        run: |
          # Condition 1 : Compiler explicitement le plug-in sans target pour qu'il aille dans target/release/
          cargo build --release -p westplay-plugin
        shell: powershell

      - name: Clean Author Signature from Config
        run: |
          # Condition 2 : Supprimer la clé de signature privée de l'auteur dans la config de release
          $configPath = "app/tauri.release.conf.json"
          if (Test-Path $configPath) {
              $config = Get-Content $configPath -Raw | ConvertFrom-Json
              # Supprime le bloc de signature pour éviter l'erreur de build Tauri
              if ($config.bundle.windows -and $config.bundle.windows.certificateThumbprint) {
                  $config.bundle.windows.PSObject.Properties.Remove("certificateThumbprint")
              }
              $config | ConvertTo-Json -Depth 100 | Set-Content $configPath
              Write-Host "Clé de signature retirée avec succès de tauri.release.conf.json"
          } else {
              Write-Host "Utilisation de app/tauri.conf.json (tauri.release.conf.json introuvable)"
          }
        shell: powershell

      - name: Build Official Installer
        run: |
          npm install
          # Utilise le fichier de configuration de release si disponible
          if (Test-Path "app/tauri.release.conf.json") {
            npx tauri build --config app/tauri.release.conf.json
          } else {
            npx tauri build --config app/tauri.conf.json
          }
        env:
          CI: true

      - name: Verify and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Installeur-Officiel
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
          if-no-files-found: error
