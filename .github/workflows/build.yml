name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Build Project
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true

      - name: Upload Real Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Installeur-Final
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/msi/*.msi
