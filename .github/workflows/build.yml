name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Inject Resources into Tauri Config
        run: |
          $configPath = "app/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          
          # Correction de la syntaxe pour ajouter correctement le dossier installer aux ressources de Tauri
          if ($null -eq $config.bundle.resources) {
              $config.bundle | Add-Member -MemberType NoteProperty -Name "resources" -Value @("installer/*") -Force
          } else {
              [System.Collections.ArrayList]$res = $config.bundle.resources
              [void]$res.Add("installer/*")
              $config.bundle.resources = $res
          }
          
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath
        shell: powershell

      - name: Build Project
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true

      - name: Upload Real Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Installeur-Final
          path: |
            app/target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe
            app/target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
