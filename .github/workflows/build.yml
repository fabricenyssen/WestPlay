name: Build WestPlay Portable Application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "westplay-2.1.4-son3d-egaliseur-reprise.patch") {
            git apply --verbose westplay-2.1.4-son3d-egaliseur-reprise.patch
          } elseif (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Compile Game Plugin (DLL)
        run: |
          # Étape clé : On compile la DLL avant l'hôte, sans l'option --target
          cargo build --release -p westplay-plugin
        shell: powershell

      - name: Compile Main Application (EXE)
        run: |
          npm install
          # On build l'application sans lancer le packaging de l'installeur
          npm run build
        env:
          CI: true
        continue-on-error: true

      - name: Assemble Portable Folder
        run: |
          # 1. Création du dossier final qui sera dans votre ZIP
          New-Item -ItemType Directory -Force -Path "WestPlay_Portable"
          
          # 2. Copie de l'exécutable modifié
          Copy-Item -Path "target/release/westplay.exe" -Destination "WestPlay_Portable/westplay.exe" -Force
          
          # 3. Inclusion de la DLL du plug-in fraîchement compilée au bon endroit
          Copy-Item -Path "target/release/westplay.dll" -Destination "WestPlay_Portable/westplay.dll" -Force -ErrorAction SilentlyContinue
          
          # 4. Copie des dossiers compagnons (app et assets) indispensables
          Copy-Item -Path "app" -Destination "WestPlay_Portable/app" -Recurse -Force
          if (Test-Path "assets") {
            Copy-Item -Path "assets" -Destination "WestPlay_Portable/assets" -Recurse -Force
          }
        shell: powershell

      - name: Upload Portable Application
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Version-Portable
          path: WestPlay_Portable/
