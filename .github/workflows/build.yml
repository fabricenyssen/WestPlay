name: Build Fixed Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Compile Application
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true
        continue-on-error: true

      - name: Create Manual Delivery Folder
        run: |
          # 1. On crée un dossier propre sur le serveur pour rassembler les pièces
          New-Item -ItemType Directory -Force -Path "WestPlay_Modifie_Final"
          
          # 2. On y copie l'application modifiée que GitHub a réussi à compiler
          Copy-Item -Path "target/release/westplay.exe" -Destination "WestPlay_Modifie_Final/westplay.exe" -Force
          
          # 3. On y ajoute le dossier du plug-in pour que le voyant rouge s'éteigne
          Copy-Item -Path "app" -Destination "WestPlay_Modifie_Final/app" -Recurse -Force
          
          # 4. On y ajoute le dossier assets au cas où
          if (Test-Path "assets") {
            Copy-Item -Path "assets" -Destination "WestPlay_Modifie_Final/assets" -Recurse -Force
          }
        shell: powershell

      - name: Upload Working Game Package
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Complet-Sans-Erreur
          path: WestPlay_Modifie_Final/
