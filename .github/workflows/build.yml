name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Build Project
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true

      - name: Assemble Files Manually
        run: |
          # On copie de force le dossier indispensable du plug-in (app) juste à côté du fichier westplay.exe généré
          Copy-Item -Path "app" -Destination "target/release/app" -Recurse -Force -ErrorAction SilentlyContinue
        shell: powershell

      - name: Upload Complete Package
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Complet-Avec-Plugin
          path: |
            target/release/westplay.exe
            target/release/app/
