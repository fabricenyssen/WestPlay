name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
            Write-Host "Patch appliqué avec succès."
          } else {
            Write-Host "Aucun patch trouvé."
          }
        shell: powershell

      - name: Prepare Tauri Resources
        run: |
          # Crée les dossiers de destination attendus par l'exécutable à l'intérieur de target/release
          New-Item -ItemType Directory -Force -Path "target/release/app"
          New-Item -ItemType Directory -Force -Path "target/release/installer"
          
          # Copie les fichiers requis
          Copy-Item -Path "app/*" -Destination "target/release/app" -Recurforce -ErrorAction SilentlyContinue
          Copy-Item -Path "app/installer/*" -Destination "target/release/installer" -Recurforce -ErrorAction SilentlyContinue
          Copy-Item -Path "assets" -Destination "target/release/assets" -Recurforce -ErrorAction SilentlyContinue
        shell: powershell

      - name: Build Project
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true

      - name: Force Include Folders in Artifact
        run: |
          # Au cas où Tauri ne les packagerait pas dans l'installer, on les met à côté dans le ZIP de téléchargement
          Copy-Item -Path "app/installer" -Destination "target/release/" -Recurforce -ErrorAction SilentlyContinue
        shell: powershell

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Modifie
          path: |
            target/release/
