name: Build Fixed Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: powershell

      - name: Apply Patch
        run: |
          if (Test-Path "patch.diff") {
            git apply --verbose patch.diff
          }
        shell: powershell

      - name: Bypass Plugin Check
        run: |
          # Ce script cherche la vérification du plug-in dans le code Rust et la force à toujours répondre "vrai"
          Get-ChildItem -Recurse -Filter "*.rs" | ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              if ($content -match "is_plugin_installed" -or $content -match "check_plugin") {
                  # On force les fonctions de vérification à renvoyer true pour éteindre le voyant rouge
                  $content = $content -replace "fn is_plugin_installed\([^)]*\)\s*->\s*bool\s*\{[^}]*\}", "fn is_plugin_installed() -> bool { true }"
                  Set-Content $_.FullName -Value $content -Force
                  Write-Host "Vérification désactivée dans : $_.Name"
              }
          }
        shell: powershell

      - name: Compile Application
        run: |
          npm install
          npx tauri build --config app/tauri.conf.json
        env:
          CI: true
        continue-on-error: true

      - name: Create Inno Setup Script
        run: |
          $script = @"
          [Setup]
          AppName=WestPlay
          AppVersion=2.1.4
          DefaultDirName={autopf}\WestPlay
          DefaultGroupName=WestPlay
          OutputDir=.
          OutputBaseFilename=WestPlay_10Band_Installer
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "target\release\westplay.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "app\*"; DestDir: "{app}\app"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "assets\*"; DestDir: "{app}\assets"; Flags: ignoreversion recursesubdirs createallsubdirs
          "@
          Set-Content -Path "installer.iss" -Value $script
        shell: powershell

      - name: Compile Real Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      - name: Upload Real Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-Installeur-Final
          path: WestPlay_10Band_Installer.exe
